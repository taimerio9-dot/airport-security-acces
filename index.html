
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRPORT SECURITY ACCESS - TIER 2</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
  background: #172235;
  border-radius: 15px;
}

h2 {
  color: #38bdf8;
}

.camera-box {
  position: relative;
  width: 100%;
  margin: 20px auto;
}

video {
  display: block;
  width: 100%;
  border-radius: 10px;
  background: black;
}

#faceCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

button {
  padding: 12px 18px;
  margin: 6px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.start {
  background: #16a34a;
  color: white;
}

.capture {
  background: #2563eb;
  color: white;
}

.clear {
  background: #f59e0b;
  color: black;
}

.stop {
  background: #dc2626;
  color: white;
}

#status {
  margin: 18px 0;
  font-weight: bold;
  color: #facc15;
}

#snapshot {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}

#timeInfo {
  color: #38bdf8;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>AIRPORT SECURITY ACCESS</h2>
<p>TIER 2 - FACE DETECTION SYSTEM</p>

<div class="camera-box">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="faceCanvas"></canvas>
</div>

<div id="status">SISTEM BELUM DIAKTIFKAN</div>

<button class="start" id="startButton">AKTIFKAN KAMERA</button>
<button class="capture" id="captureButton">AMBIL SNAPSHOT</button>
<button class="clear" id="clearButton">HAPUS SNAPSHOT</button>
<button class="stop" id="stopButton">MATIKAN KAMERA</button>

<h3>HASIL SNAPSHOT</h3>
<canvas id="snapshot"></canvas>
<div id="timeInfo"></div>

</div>

<script>
const video = document.getElementById("camera");
const faceCanvas = document.getElementById("faceCanvas");
const snapshot = document.getElementById("snapshot");
const statusText = document.getElementById("status");
const timeInfo = document.getElementById("timeInfo");

const MODEL_URL =
"https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights";

let stream = null;
let running = false;
let busy = false;
let modelsReady = false;
let capturedForCurrentDetection = false;
let snapshotTimer = null;

function setStatus(message, color = "#facc15") {
  statusText.textContent = message;
  statusText.style.color = color;
}

async function startCamera() {
  try {
    if (running) return;

    setStatus("MEMUAT LIBRARY DETEKSI WAJAH...");

    if (typeof faceapi === "undefined") {
      throw new Error("Library face-api.js gagal dimuat.");
    }

    if (!modelsReady) {
      setStatus("MEMUAT MODEL DETEKSI WAJAH...");
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      modelsReady = true;
    }

    setStatus("MEMBUKA KAMERA...");

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    faceCanvas.width = video.videoWidth;
    faceCanvas.height = video.videoHeight;

    running = true;
    capturedForCurrentDetection = false;

    setStatus("KAMERA AKTIF - MEMERIKSA WAJAH", "#38bdf8");

    detectFace();

  } catch (error) {
    setStatus("ERROR: " + error.message, "#ef4444");
  }
}

async function detectFace() {
  if (!running || busy) return;

  busy = true;

  try {
    const detections = await faceapi.detectAllFaces(
      video,
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 320,
        scoreThreshold: 0.35
      })
    );

    const context = faceCanvas.getContext("2d");
    context.clearRect(0, 0, faceCanvas.width, faceCanvas.height);

    const resized = faceapi.resizeResults(detections, {
      width: faceCanvas.width,
      height: faceCanvas.height
    });

    faceapi.draw.drawDetections(faceCanvas, resized);

    if (detections.length > 0) {
      setStatus("WAJAH TERDETEKSI", "#22c55e");

      if (!capturedForCurrentDetection && !snapshotTimer) {
        snapshotTimer = setTimeout(() => {
          snapshotTimer = null;

          if (running && video.readyState >= 2) {
            takeSnapshot();
            capturedForCurrentDetection = true;
            setStatus("WAJAH TERDETEKSI - SNAPSHOT BERHASIL", "#22c55e");
          }
        }, 500);
      }

    } else {
      setStatus("WAJAH TIDAK TERDETEKSI", "#facc15");
      capturedForCurrentDetection = false;

      if (snapshotTimer) {
        clearTimeout(snapshotTimer);
        snapshotTimer = null;
      }
    }

  } catch (error) {
    running = false;
    setStatus("ERROR DETEKSI: " + error.message, "#ef4444");
  } finally {
    busy = false;

    if (running) {
      setTimeout(detectFace, 500);
    }
  }
}

function takeSnapshot() {
  if (!running || video.readyState < 2) {
    setStatus("KAMERA BELUM SIAP", "#ef4444");
    return;
  }

  snapshot.width = video.videoWidth;
  snapshot.height = video.videoHeight;

  const context = snapshot.getContext("2d");

  context.drawImage(
    video,
    0,
    0,
    snapshot.width,
    snapshot.height
  );

  snapshot.style.display = "block";

  timeInfo.textContent =
    "Waktu Snapshot: " + new Date().toLocaleString("id-ID");
}

function captureManual() {
  takeSnapshot();
}

function clearSnapshot() {
  const context = snapshot.getContext("2d");

  context.clearRect(
    0,
    0,
    snapshot.width,
    snapshot.height
  );

  snapshot.style.display = "none";
  timeInfo.textContent = "";

  capturedForCurrentDetection = false;

  setStatus("SNAPSHOT DIHAPUS", "#38bdf8");
}

function stopCamera() {
  running = false;

  if (snapshotTimer) {
    clearTimeout(snapshotTimer);
    snapshotTimer = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;

  faceCanvas.getContext("2d").clearRect(
    0,
    0,
    faceCanvas.width,
    faceCanvas.height
  );

  setStatus("KAMERA DIMATIKAN", "#ef4444");
}

document.getElementById("startButton")
  .addEventListener("click", startCamera);

document.getElementById("captureButton")
  .addEventListener("click", captureManual);

document.getElementById("clearButton")
  .addEventListener("click", clearSnapshot);

document.getElementById("stopButton")
  .addEventListener("click", stopCamera);

</script>

</body>
</html>
