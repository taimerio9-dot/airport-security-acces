
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRPORT SECURITY ACCESS - TIER 2</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 650px;
  margin: auto;
  background: #172235;
  padding: 20px;
  border-radius: 15px;
}

h2 {
  color: #38bdf8;
}

.camera-box {
  position: relative;
  width: 100%;
  margin: 20px auto;
}

video {
  width: 100%;
  border-radius: 10px;
  background: black;
}

#faceCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

button {
  padding: 12px 18px;
  margin: 6px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.start {
  background: #16a34a;
  color: white;
}

.capture {
  background: #2563eb;
  color: white;
}

.stop {
  background: #dc2626;
  color: white;
}

#status {
  margin: 18px 0;
  font-weight: bold;
  color: #facc15;
}

#snapshot {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>AIRPORT SECURITY ACCESS</h2>
<p>TIER 2 - FACE DETECTION SYSTEM</p>

<div class="camera-box">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="faceCanvas"></canvas>
</div>

<div id="status">SISTEM BELUM DIAKTIFKAN</div>

<button class="start" onclick="startCamera()">
AKTIFKAN KAMERA
</button>

<button class="capture" onclick="captureSnapshot()">
AMBIL SNAPSHOT
</button>

<button class="stop" onclick="stopCamera()">
MATIKAN KAMERA
</button>

<canvas id="snapshot"></canvas>

</div>

<script>
const video = document.getElementById("camera");
const faceCanvas = document.getElementById("faceCanvas");
const statusText = document.getElementById("status");

let cameraStream = null;
let detectionTimer = null;
let modelsReady = false;

const MODEL_URL =
"https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights";

async function startCamera() {
  try {
    statusText.textContent = "MEMUAT MODEL DETEKSI WAJAH...";

    if (!modelsReady) {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      modelsReady = true;
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = cameraStream;

    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    await video.play();

    faceCanvas.width = video.videoWidth;
    faceCanvas.height = video.videoHeight;

    statusText.textContent = "KAMERA AKTIF - MENDETEKSI WAJAH";

    detectFace();

  } catch (error) {
    statusText.textContent = "ERROR: " + error.message;
  }
}

async function detectFace() {
  if (!cameraStream || video.paused) return;

  const result = await faceapi.detectAllFaces(
    video,
    new faceapi.TinyFaceDetectorOptions()
  );

  const context = faceCanvas.getContext("2d");
  context.clearRect(0, 0, faceCanvas.width, faceCanvas.height);

  const resized = faceapi.resizeResults(result, {
    width: faceCanvas.width,
    height: faceCanvas.height
  });

  faceapi.draw.drawDetections(faceCanvas, resized);

  if (result.length > 0) {
    statusText.textContent = "WAJAH TERDETEKSI";
    statusText.style.color = "#22c55e";
  } else {
    statusText.textContent = "WAJAH TIDAK TERDETEKSI";
    statusText.style.color = "#facc15";
  }

  detectionTimer = setTimeout(detectFace, 300);
}

function captureSnapshot() {
  if (!cameraStream) {
    statusText.textContent = "AKTIFKAN KAMERA TERLEBIH DAHULU";
    return;
  }

  const canvas = document.getElementById("snapshot");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  canvas.style.display = "block";
}

function stopCamera() {
  if (detectionTimer) {
    clearTimeout(detectionTimer);
    detectionTimer = null;
  }

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;

  const context = faceCanvas.getContext("2d");
  context.clearRect(0, 0, faceCanvas.width, faceCanvas.height);

  statusText.textContent = "KAMERA DIMATIKAN";
  statusText.style.color = "#facc15";
}
</script>

</body>
</html>
